name: Deploy Nastasya Astro

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in app-core.js app-calc.js app-ui.js app-init.js verified-transits.js; do
            node --check "$file"
          done

      - name: Validate site files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html astronomy.browser.min.js app-core.js app-calc.js app-ui.js app-init.js verified-transits.js manifest.webmanifest icon.svg sw.js; do
            test -s "$file"
          done
          grep -q 'app-core.js' index.html
          grep -q 'verified-transits.js' index.html
          grep -q '01.04.2002' index.html
          ! grep -R -q 'Єинансовые' .

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
